name: Terraform Import Resource

on:
  workflow_dispatch:
    inputs:
      resource_address:
        description: "Terraform Resource Address"
        required: true
        default: "aws_iam_role.iam_for_lambda"
      resource_id:
        description: "AWS Resource Name / ID to Import"
        required: true
        default: "iam_package_scan_tk-tf-3-6-snyk-scan_lambda"

permissions:
  id-token: write
  contents: read

jobs:
  import-resource:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.OIDC_ROLE }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        run: terraform init

      - name: Run Terraform Import
        run: |
          terraform import "${{ github.event.inputs.resource_address }}" "${{ github.event.inputs.resource_id }}"